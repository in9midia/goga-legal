# Modelo das credenciais do chart. Copie e preencha:
#
#   cp charts/goga/secrets.example.yaml charts/goga/secrets.yaml
#
# secrets.yaml esta no .gitignore. Gere chaves com `openssl rand -hex 32`.
#
# ⚠ kbSecretKey e studio.secretKey cifram credenciais de provedor gravadas no
# banco. Troca-las depois do primeiro deploy torna essas credenciais ilegiveis.
# ⚠ As senhas do Postgres so valem no PRIMEIRO boot (initdb). Trocar aqui
# depois exige ALTER USER no banco.

postgres:
  superPassword: ""        # usuario `postgres`
  kbPassword: ""           # usuario `knowledge_base`
  studioPassword: ""       # usuario `studio`

kb:
  secretKey: ""            # KB_SECRET_KEY (openssl rand -hex 32)
  serviceToken: ""         # KB_SERVICE_TOKEN (ex.: kb_$(openssl rand -hex 24))

# Basic auth do Ingress da KB — so usado com kb.auth=basic (values.yaml).
kbBasicAuth:
  user: goga
  password: ""

# S3 do bruto da KB. Para OCI: Customer Secret Key do usuario.
s3:
  accessKey: ""
  secretKey: ""

studio:
  adminEmail: admin@goga.legal   # sobrescreve o values.yaml
  secretKey: ""          # STUDIO_SECRET_KEY (openssl rand -hex 32)
  sessionSecret: ""        # STUDIO_SESSION_SECRET (openssl rand -hex 32)
  adminPassword: ""        # senha do admin criado no primeiro boot
  deepseekApiKey: ""       # usadas so no primeiro boot, para semear provedores
  geminiApiKey: ""

# Pull do OCIR. username = <tenancy-namespace>/<usuario> (ex.:
# grc4sekoeyuf/oracleidentitycloudservice/voce@email.com); password = Auth Token.
# Deixe vazio se o repositorio do OCIR for publico.
registry:
  server: gru.ocir.io
  username: ""
  password: ""
