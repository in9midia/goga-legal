# Todos os Secrets do namespace, a partir de secrets.yaml (nao versionado).
{{- $pgKb := include "goga.req" (list . "postgres.kbPassword") }}
{{- $pgStudio := include "goga.req" (list . "postgres.studioPassword") }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels: {{- include "goga.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ include "goga.req" (list . "postgres.superPassword") | quote }}
  KB_DB_PASSWORD: {{ $pgKb | quote }}
  STUDIO_DB_PASSWORD: {{ $pgStudio | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: knowledge-base-secret
  labels: {{- include "goga.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgKb | quote }}
  KB_SECRET_KEY: {{ include "goga.req" (list . "kb.secretKey") | quote }}
  KB_SERVICE_TOKEN: {{ include "goga.req" (list . "kb.serviceToken") | quote }}
  # Mesmo valor do KB_ADMIN_GROUP: divergencia faz a busca do token voltar vazia.
  KB_SERVICE_TOKEN_GROUPS: {{ .Values.kb.config.KB_ADMIN_GROUP | quote }}
---
# Vira o kb-api para o bucket da nuvem. So entram chaves preenchidas: chave
# vazia sobrescreveria o padrao do codigo (ex.: S3_ENDPOINT regional).
apiVersion: v1
kind: Secret
metadata:
  name: storage-secret
  labels: {{- include "goga.labels" . | nindent 4 }}
type: Opaque
stringData:
  S3_PROVIDER: {{ .Values.kb.s3.provider | quote }}
  S3_BUCKET: {{ required "kb.s3.bucket" .Values.kb.s3.bucket | quote }}
  S3_REGION: {{ required "kb.s3.region" .Values.kb.s3.region | quote }}
  {{- with .Values.kb.s3.namespace }}
  S3_NAMESPACE: {{ . | quote }}
  {{- end }}
  {{- with .Values.kb.s3.endpoint }}
  S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  S3_ACCESS_KEY: {{ include "goga.req" (list . "s3.accessKey") | quote }}
  S3_SECRET_KEY: {{ include "goga.req" (list . "s3.secretKey") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: studio-secrets
  labels: {{- include "goga.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgres://studio:%s@postgres:5432/studio" (urlquery $pgStudio) | quote }}
  STUDIO_SECRET_KEY: {{ include "goga.req" (list . "studio.secretKey") | quote }}
  STUDIO_SESSION_SECRET: {{ include "goga.req" (list . "studio.sessionSecret") | quote }}
  STUDIO_ADMIN_EMAIL: {{ .Values.studio.adminEmail | quote }}
  STUDIO_ADMIN_PASSWORD: {{ include "goga.req" (list . "studio.adminPassword") | quote }}
  DEEPSEEK_API_KEY: {{ .Values.studio.deepseekApiKey | default "" | quote }}
  GEMINI_API_KEY: {{ .Values.studio.geminiApiKey | default "" | quote }}
{{- if eq .Values.kb.auth "basic" }}
---
# Formato que o ingress-nginx espera: chave `auth` com linhas htpasswd.
apiVersion: v1
kind: Secret
metadata:
  name: kb-basic-auth
  labels: {{- include "goga.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth: {{ htpasswd (include "goga.req" (list . "kbBasicAuth.user")) (include "goga.req" (list . "kbBasicAuth.password")) | quote }}
{{- end }}
{{- if .Values.registry.username }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ocir
  labels: {{- include "goga.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .Values.registry.server (dict "username" .Values.registry.username "password" .Values.registry.password "auth" (printf "%s:%s" .Values.registry.username .Values.registry.password | b64enc))) | toJson | b64enc }}
{{- end }}
