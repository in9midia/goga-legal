# Espaços e permissões do repertório jurídico do Goga — configuração declarativa.
#
# Fonte normativa: `planning/02-BASE-CONHECIMENTO.md` §2.1 (os 17 Espaços), §2.2
# (grants), §3.1 (motor de corte), §6 (onde a wiki é ligada) e §10 (as ondas).
# Os 5 Espaços do fim do arquivo vêm de `planning/00-MVP-PLANO.md` §5.4 item 2.
#
# POR QUE ISTO É ARQUIVO E NÃO UMA SEQUÊNCIA DE CLIQUES
#
# Permissão de leitura de repertório é o que separa "competência exclusiva"
# escrita em prompt de competência exclusiva que vale. Criada na tela, ela não
# tem revisão, não tem histórico e não tem como ser conferida: a pergunta "o
# `triagem` alcança `processual-civil`?" só se responde consultando o banco de
# produção. Aqui ela se responde lendo o arquivo, e uma mudança aparece no diff.
#
# O `scripts/apply-spaces.py` aplica este arquivo contra uma KB de pé, e é
# idempotente: rodar de novo não duplica nada e não desfaz ajuste feito na tela
# que este arquivo não descreve.
#
# ─────────────────────────────────────────────────────────────────────────────
# DUAS COISAS QUE ESTE ARQUIVO NÃO CONSEGUE DIZER, E QUE PRECISAM SER SABIDAS
#
# 1. PROVEDOR DE EMBEDDING. `space.embedding_provider_id` é anulável, então todo
#    Espaço nasce sem provedor e usa o padrão da instalação. Hoje não há provedor
#    nenhum cadastrado na KB (`GET /v1/ai/providers` devolve lista vazia), e sem
#    ele o Espaço é criado mas NÃO INGERE: o upload falha na hora de embedar.
#    Cadastrar provedor exige credencial do operador, que não entra em arquivo
#    versionado (ADR-0009). O script diz isso em voz alta em vez de deixar o
#    Espaço vazio parecer pronto.
#
# 2. MOTOR DE CORTE POR CAMADA. A §3.1 pede `markdown` para normativa e
#    precedentes e `semantic` para doutrinária. O motor, porém, é do ESPAÇO
#    (`space.chunking`), e as três camadas convivem dentro do mesmo Espaço — não
#    há como um documento chegar com motor próprio (o upload não aceita esse
#    parâmetro). Todos os Espaços aqui ficam em `markdown`, que é o certo para o
#    que a onda 1 ingere (lei e precedente têm estrutura explícita e cortar por
#    artigo é o corte certo). Manual de doutrina entrando num destes Espaços
#    seria cortado por heading, que é justamente o que a §3.1 quer evitar — a
#    decisão de onde a doutrina mora fica em aberto, registrada no README.

version: 1

# ── Identidades de runtime ───────────────────────────────────────────────────
#
# §2.2: "um token de serviço por agente de runtime, com grant de leitura apenas
# nos Espaços da sua competência. Nenhum agente é irrestrito."
#
# O mapa competência → runtime é o de `planning/competencias/INDEX.md`; o mapa
# competência → Espaço é o da §2.1. O cruzamento dos dois é o que está abaixo, e
# nada aqui foi escolhido: cada linha é derivável dos dois documentos.
#
# POR QUE O `especialista` APARECE UMA VEZ POR COMPETÊNCIA, E NÃO UMA SÓ VEZ
#
# O `especialista` é UM runtime parametrizado (D-02). Se ele tivesse uma
# identidade só, ela alcançaria os catorze Espaços de mérito somados — e
# `planning/05-IDENTIDADE-E-DADOS.md` §3 diz o contrário, com todas as letras:
# "o `especialista` de aéreo não alcança `bancario`". A instância parametrizada
# é o agente de runtime para efeito de identidade; o processo é um só, a
# credencial não.
#
# `spaces: []` NÃO É ESQUECIMENTO. É a competência que não consulta repertório
# jurídico, e está declarada para que "nenhum agente é irrestrito" seja
# conferível linha a linha em vez de depender de quem lembra.
agents:
  - runtime: recepcao
    group: /goga/agentes/recepcao
    competencias: [1, 2]
    spaces: []
    motivo: >-
      Recepção e intake não analisam mérito: coletam relato e classificam
      demanda. Nenhum Espaço da §2.1 lista as competências 1 ou 2.

  - runtime: documental
    group: /goga/agentes/documental
    competencias: [3, 49]
    spaces: []
    motivo: >-
      Habilitação documental. Nenhum Espaço da §2.1 lista as competências 3
      ou 49.

  - runtime: triagem
    group: /goga/agentes/triagem
    competencias: [4]
    spaces: []
    motivo: >-
      Classifica a matéria para rotear. Classificar não é analisar, e a §2.1 não
      dá repertório à competência 4. É o exemplo citado em
      `planning/05-IDENTIDADE-E-DADOS.md` §3: "o `triagem` não alcança
      `processual-civil`".

  - runtime: exclusao
    group: /goga/agentes/exclusao
    competencias: [5]
    spaces: [encaminhamento]
    motivo: >-
      Exclusão e encaminhamento para fora da plataforma. A §2.1 não lista a
      competência 5, e o `planning/00-MVP-PLANO.md` §5.4 item 2 cria para ela
      o Espaço `encaminhamento` (Defensoria, OAB, MP, Procon, delegacias): o
      agente precisa saber PARA ONDE mandar, não analisar mérito.

  - runtime: orquestrador
    group: /goga/agentes/orquestrador
    competencias: [6]
    spaces: []
    motivo: >-
      §2.2, textual: "o `orquestrador` não tem grant nenhum de repertório — ele
      não analisa mérito". Além disso ele não é LLM: é máquina de estados em
      código (D-01).

  - runtime: prazos
    group: /goga/agentes/prazos
    competencias: [7]
    spaces: [processual-civil]
    motivo: >-
      §2.1 lista a competência 7 em `processual-civil`. O CÁLCULO do prazo não
      sai daqui: é código determinístico no `goga-calc` (D-03). O repertório
      serve para saber QUAL regime se aplica, que é onde o erro é silencioso.

  - runtime: compliance
    group: /goga/agentes/compliance
    competencias: [8]
    spaces: [etica-regulatorio]
    motivo: >-
      §2.1 lista a competência 8 em `etica-regulatorio` (uso interno). O
      Guardião não consulta repertório de mérito: ele confere a saída contra a
      Lei 8.906/94, o CED e a LGPD.

  - runtime: redator
    group: /goga/agentes/redator
    competencias: [9, 10, 44]
    spaces: [estilo-peca]
    motivo: >-
      §2.1 lista a competência 44 em `estilo-peca`. As competências 9 e 10 não
      aparecem em Espaço nenhum: o redator escreve sobre o que o especialista
      apurou, não sobre repertório que ele mesmo busque.

  - runtime: handoff
    group: /goga/agentes/handoff
    competencias: [11]
    spaces: [processual-civil, etica-regulatorio]
    motivo: >-
      §2.1 lista a competência 11 em `processual-civil` e em `etica-regulatorio`
      (uso interno).

  - runtime: extrajudicial
    group: /goga/agentes/extrajudicial
    competencias: [52]
    spaces: [cdc, estilo-peca, extrajudicial]
    motivo: >-
      §2.1 lista a competência 52 em `cdc` e em `estilo-peca`; o
      `planning/00-MVP-PLANO.md` §5.4 item 2 acrescenta `extrajudicial`
      (canais e modelos de reclamação).

  - runtime: registro
    group: /goga/agentes/registro
    competencias: [35]
    spaces: []
    motivo: >-
      Registro e autocrítica, fora do caminho de resposta. Nenhum Espaço da §2.1
      lista a competência 35. Ele realimenta a fila de curadoria (§5.2) pela
      API do Goga, não lendo repertório.

  - runtime: memoria
    group: /goga/agentes/memoria
    competencias: [12]
    spaces: []
    motivo: Nenhum Espaço da §2.1 lista a competência 12.

  - runtime: qualidade
