  # `onda: mvp`, e não um número: a §10 fixa quatro ondas e nenhuma delas
  # prevê estes Espaços. Um número inventado aqui faria o `--onda N` do
  # `apply-spaces.py` misturá-los a uma onda que não os planejou.
  #
  # Wiki desligada nos cinco. A §6 nomeia onde ela liga, e estes não estão lá;
  # nos dois operacionais a razão é a mesma do `estilo-peca`: destilar canal ou
  # modelo perde a literalidade que eles existem para ter.
