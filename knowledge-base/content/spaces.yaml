    motivo: §2.1 lista a competência 32 em `processual-civil` e em `estilo-peca`.

  - runtime: monitor
    group: /goga/agentes/monitor
    competencias: [33]
    spaces: [processual-civil]
    motivo: §2.1 lista a competência 33 em `processual-civil`.

  - runtime: adversidade
    group: /goga/agentes/adversidade
    competencias: [34]
    spaces: []
    motivo: >-
      LACUNA DELIBERADA, e não descuido. Nenhum Espaço da §2.1 lista a
      competência 34, e o catálogo (`planning/competencias/INDEX.md`, §3 do
      WP-03) registra que ela pede "todo o repertório" — o que colide de frente
