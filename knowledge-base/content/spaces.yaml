# ── Grupos humanos ───────────────────────────────────────────────────────────
#
# Os caminhos vêm do realm `goga-interno` e do ADR-0023 do `knowledge-base`, não
# da §2.2: onde o plano escreve `curadoria-juridica`, o realm e o ADR-0023 já
# fixaram `/goga/curadoria`, e o `KB_ADMIN_GROUP` da instalação aponta para ele.
# Seguir o nome do plano criaria um grupo que não existe em lugar nenhum.
#
# O grant de escrita da curadoria é REDUNDANTE hoje: `/goga/curadoria` é o grupo
# de administração e já alcança tudo sem grant. Está declarado assim mesmo
# porque a permissão passa a viver no arquivo, e não numa variável de ambiente
# do cluster — no dia em que o `KB_ADMIN_GROUP` mudar, o acesso da curadoria não
# some junto.
groups:
  - group: /goga/curadoria
    role: editor
    spaces: todos
    motivo: >-
      §2.2 pede um grupo de curadoria com escrita. ADR-0023 fixa `/goga/curadoria`
      como quem ingere e corrige o repertório.

  - group: /goga/responsavel-tecnico
    role: reader
    spaces: todos
    motivo: >-
      ADR-0023: o responsável técnico "entra na KB para revisar e assinar
      (`human-reviewed`). Precisa LER o que assina, não criar Espaço". Leitura em
      todos os Espaços porque a etapa 4 do pipeline (§8) é dele em qualquer área,
      e é a única etapa que abre a zona amarela.

# ── Os 17 Espaços da §2.1, e os 5 do MVP no fim ────────────────────────────────────────────────────────────
#
# `chunking.enrichment: conceito` é o que a §3 chama de `enrichment = conceito`:
# a identidade do conceito é prependada a cada trecho antes do embedding. É o que
# faz "art. 1.015, II" ser recuperado junto com "recurso contra decisão de
# mérito". Ligado em todos porque todo Espaço daqui recebe conceito OKF.
#
# `okf_types` é o vocabulário da §4. Fechado de propósito: com texto livre,
# quarenta conceitos rendem trinta rótulos quase iguais e o tipo deixa de agrupar.
#
# `engine: markdown` vale para os dezessete, pela razão do cabeçalho deste
# arquivo: o motor é do Espaço, e o que a onda 1 ingere é norma e precedente.
# Um Espaço que precise de `semantic` sobrescreve `chunking` na própria entrada.
defaults:
  chunking:
    engine: markdown
    enrichment: conceito
    okf_types: [Norma, Precedente, Tese, Procedimento, Modelo]

