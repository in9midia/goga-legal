  # ── Os 5 Espaços do MVP ────────────────────────────────────────────────────
  #
  # Vêm do `planning/00-MVP-PLANO.md` §5.4 item 2, e não da §2.1: são as
  # especialidades que, sem Espaço próprio, liam repertório emprestado do `cdc`
