# Conjunto de avaliação do Espaço `calculo-monetario`.
#
# As regras deste arquivo estão em `content/README.md`, seção "Conjuntos de
# avaliação". Em resumo: voz de leigo → `strategy: dificil` com `kind`; voz de
# técnico → `strategy: direta`; `reference` vazio em todas (R4).
#
# UMA ADVERTÊNCIA QUE VALE SÓ PARA ESTE ESPAÇO
#
# Este repertório não é consultado para CALCULAR. Cálculo de prazo e de valor é
# código determinístico no `goga-calc` (D-03). O que a busca aqui precisa acertar
# é a ESCOLHA DO REGIME — qual índice, qual termo inicial, qual prazo — porque é
# nela que o erro é silencioso e gera dano indenizável. Por isso quase toda
# pergunta abaixo pergunta "qual regime se aplica", e nenhuma pede uma conta.

space: calculo-monetario
questions:
  # ── voz de leigo (25) ────────────────────────────────────────────────────
  - question: "desde quando conta a correção do dinheiro que a empresa me deve?"
    strategy: dificil
    kind: limite
  - question: "os juros começam a contar da data do problema ou da data em que eu entrei na justiça?"
    strategy: dificil
    kind: distincao
  - question: "qual índice é usado hoje para corrigir um valor atrasado?"
    strategy: dificil
    kind: parafrase
  - question: "o valor que eu paguei em 2019 vale quanto hoje para efeito de devolução?"
    strategy: dificil
    kind: parafrase
  - question: "mudou alguma coisa nos juros de dívida depois de 2024?"
    strategy: dificil
    kind: limite
  - question: "a correção e os juros são a mesma coisa?"
    strategy: dificil
    kind: distincao
  - question: "no dano moral a correção conta desde quando aconteceu ou desde quando o juiz fixou o valor?"
    strategy: dificil
    kind: distincao
  - question: "quanto costumam dar de indenização por nome negativado indevidamente?"
    strategy: dificil
    kind: limite
  - question: "quanto costumam dar de indenização quando o voo atrasa muitas horas?"
    strategy: dificil
    kind: limite
  - question: "quanto costumam dar quando cortam a luz da casa indevidamente?"
    strategy: dificil
    kind: limite
  - question: "quanto costumam dar quando some dinheiro da conta por golpe?"
    strategy: dificil
    kind: limite
  - question: "quanto costumam dar quando vazam meus dados pessoais?"
    strategy: dificil
    kind: limite
  - question: "o valor da indenização muda conforme o tamanho da empresa?"
    strategy: dificil
    kind: consequencia
  - question: "o valor da indenização muda de um estado para o outro?"
    strategy: dificil
    kind: distincao
  - question: "a empresa me devolve só o que eu paguei ou o dobro?"
    strategy: dificil
    kind: distincao
  - question: "se eu pagar uma cobrança errada e depois descobrir, recebo o dobro de volta?"
    strategy: dificil
    kind: excecao
  - question: "somando tudo o que eu quero pedir, cabe no juizado?"
    strategy: dificil
    kind: limite
  - question: "quanto é o teto de valor do juizado especial?"
    strategy: dificil
    kind: limite
  - question: "se eu pedir mais do que o teto, o que acontece?"
    strategy: dificil
    kind: consequencia
  - question: "o dinheiro que eu deixei de ganhar por causa do problema entra na conta?"
    strategy: dificil
    kind: distincao
  - question: "quando a dívida é com o governo os juros são diferentes?"
    strategy: dificil
    kind: excecao
  - question: "o atraso da construtora na entrega do imóvel rende alguma compensação em dinheiro?"
    strategy: dificil
    kind: consequencia
  - question: "se eu desistir do imóvel na planta, quanto a construtora pode ficar?"
    strategy: dificil
    kind: limite
  - question: "o conserto do meu carro depois da batida é corrigido desde quando?"
    strategy: dificil
    kind: multi_salto
  - question: "eu tenho que provar o prejuízo com nota fiscal ou dá para estimar?"
    strategy: dificil
    kind: consequencia

