  - question: "Em que hipóteses a LGPD exige relatório de impacto à proteção de dados pessoais?"
    strategy: direta
  - question: "O que a LGPD estabelece sobre prazo e critério de eliminação de dados após o fim do tratamento?"
    strategy: direta
  - question: "O que a LGPD dispõe sobre decisões automatizadas e o direito de revisão?"
    strategy: direta
  - question: "Que obrigações de transparência a LGPD impõe quanto ao uso de sistemas automatizados no atendimento?"
    strategy: direta
  - question: "O que a legislação exige em matéria de disclaimer e informação sobre limites do serviço jurídico digital?"
    strategy: direta
  - question: "Que vedações a Lei 8.906/94 impõe à sociedade de advogados quanto a sócio não advogado?"
