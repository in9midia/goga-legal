# MinIO — object storage do documento BRUTO (ING-02).
#
# Diferente do agentic-sdlc, aqui o volume e PERSISTENTE, nao emptyDir: o bruto
# e o artefato de auditoria e a base do reprocessamento com outra tecnica de
# extracao. Perde-lo num restart de pod tiraria justamente a propriedade que o
# requisito pede.
#
# Em producao o alvo e OCI Object Storage: mesmo codigo (SigV4), so troca
# endpoint e credencial (FUN-12).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: stack-knowledge-base
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: stack-knowledge-base
spec:
  replicas: 1
  strategy: { type: Recreate }   # PVC RWO
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          # quay.io e tag fixa, e nao `minio/minio:latest` do Docker Hub.
          # Dois motivos, nesta ordem: a partir de 2025 o repositorio no Hub
          # passou a exigir autenticacao, e o pull anonimo falha com
          # `insufficient_scope`, mensagem que parece problema de rede; e tag
          # movel faz dois clusters criados em semanas diferentes rodarem
          # versoes diferentes sem nada no repositorio explicando a diferenca.
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: "kbkey" }
            - { name: MINIO_ROOT_PASSWORD, value: "kbsecret123" }
          ports:
            - { containerPort: 9000, name: s3 }
            - { containerPort: 9001, name: console }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: stack-knowledge-base
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
