# Segredos da stack. NAO e aplicado pelo kustomize (ver kustomization.yaml):
# serve de DOCUMENTACAO do formato do segredo. Quem cria de verdade e o
# 20-deploy.sh, com os valores lidos do `.env` da raiz deste repositorio
# (mesma mecanica do agentic-sdlc).
#
# Chave do Azure OpenAI: usada para o embedding. Sem ela o Espaco fica sem
# indice vetorial e a busca cai para lexical puro.
apiVersion: v1
kind: Secret
metadata:
  name: knowledge-base-secret
  namespace: stack-knowledge-base
type: Opaque
stringData:
  # Cifra as credenciais dos provedores de IA em repouso. NAO e credencial de
  # provedor: essas sao cadastradas na tela. Gerada pelo 20-deploy.sh se vazia,
  # e PRESERVADA entre deploys -- troca-la torna ilegivel o que ja foi gravado.
  KB_SECRET_KEY: ""
  # Token de servico dos harnesses de IA (Claude Desktop, Cursor). Gerado pelo
  # 20-deploy.sh se estiver vazio.
  KB_SERVICE_TOKEN: ""
  # Mesmo valor de KB_ADMIN_GROUP: o 20-deploy.sh deriva os dois do .env, e
  # divergencia entre eles faz a busca voltar vazia sem mensagem nenhuma.
  KB_SERVICE_TOKEN_GROUPS: "/goga/curadoria"
