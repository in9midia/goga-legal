# A UI e o unico caminho do navegador ate a stack: ela serve o bundle e
# encaminha /v1 e /mcp para o kb-api, na MESMA origem -- sem CORS e sem host de
# API assado no bundle.
#
# O login nao passa por aqui: o issuer e o Identity corporativo, alcancado
# direto pelo navegador em HTTPS.
#
# ATENCAO: o entrypoint roda `envsubst` com whitelist ('$API_PROXY_TARGET
# $NGINX_RESOLVER'), entao as demais variaveis do nginx abaixo NAO sao
# substituidas no boot.
map $http_upgrade $api_connection_upgrade {
    default upgrade;
    ''      keep-alive;
}

# `/mcp` é o endpoint do servidor MCP E um endereço que gente digita.
#
# Os clientes MCP chegam de POST, pedindo JSON ou SSE. Pessoa chega de GET
# pedindo HTML — por link antigo, favorito ou curiosidade — e recebia o JSON
# cru do endpoint, que não diz nada e não leva a lugar nenhum. Quem quer
# CONECTAR precisa da página de conexão.
#
# A distinção é método + Accept, não user-agent: user-agent é fácil de errar e
# não é o que define a intenção aqui.
# Esquema ORIGINAL da requisição, preservado ao longo da cadeia.
#
# `$scheme` é o esquema como ESTE nginx vê — sempre `http`, porque o TLS termina
# antes, no túnel ou no ingress. Repassar `$scheme` sobrescrevia o
# `X-Forwarded-Proto` que vinha de fora, e o kb-api montava os metadados OAuth
# com `http://` num host público: cliente MCP recusa OAuth em http fora de
# localhost, e o redirect do login voltaria em claro.
map $http_x_forwarded_proto $esquema_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map "$request_method:$http_accept" $mcp_veio_do_navegador {
    default            0;
    "~^GET:.*text/html" 1;
}

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Redirect RELATIVO. Com o default (absolute_redirect on) o nginx monta a
    # URL com a porta em que ELE escuta -- 8080, dentro do container -- e o
    # navegador era mandado para http://localhost:8080/conectar, que nao existe
    # na maquina de ninguem. Atras de ingress e de tunel o servidor nao tem como
    # saber o endereco publico; quem sabe e o cliente.
    absolute_redirect off;

    # DNS resolvido em request-time, nao na leitura da config. Nao e ajuste
    # fino: com hostname literal no proxy_pass o nginx resolve UMA vez, ao
    # carregar a config -- se o Service da API nao resolver naquele instante o
    # processo aborta com `host not found in upstream` e o container morre.
    # Resultado seria CrashLoopBackOff da UI por causa da API, que continuava
    # saudavel. O IP tambem ficaria cacheado pela vida do processo.
    resolver         ${NGINX_RESOLVER} valid=10s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Ingestao de PDF grande passa de 1m (default do nginx) e de 60s de leitura.
    client_max_body_size 128m;

    location /v1/ {
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $esquema_original;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $api_connection_upgrade;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        # A variavel e o que forca o nginx a usar o `resolver` acima; com
        # variavel no proxy_pass ele para de repassar a URI sozinho, dai o
        # $request_uri explicito (preserva path e query byte a byte).
        set                $kb_api "${API_PROXY_TARGET}";
        proxy_pass         $kb_api$request_uri;
    }

    # O fluxo OAuth do conector mora na API, nao na SPA. Sem estas rotas o
    # `try_files ... /index.html` devolveria a pagina HTML no lugar dos
    # metadados de descoberta -- e o cliente MCP conclui que o servidor nao fala
    # OAuth, voltando a exigir token colado na mao.
    location /.well-known/ {
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $esquema_original;
        proxy_set_header   X-Forwarded-Host $http_host;
        set                $kb_api_wk "${API_PROXY_TARGET}";
        proxy_pass         $kb_api_wk$request_uri;
    }

    location /oauth/ {
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $esquema_original;
        # X-Forwarded-Host com a PORTA: o `$host` do nginx a descarta, e sem ela
        # o redirect do login volta para localhost sem porta -- que nao existe.
        proxy_set_header   X-Forwarded-Host $http_host;
        set                $kb_api_oauth "${API_PROXY_TARGET}";
        proxy_pass         $kb_api_oauth$request_uri;
    }

    # Os arquivos de imagem do servidor MCP, ANTES do `/mcp` e por REGEX.
    #
    # Sem este bloco eles caem no `location /mcp` e herdam o desvio de navegador
    # abaixo. Hoje escapariam por pouco — a regra casa `Accept: text/html`, e
    # busca de imagem manda `image/*` —, mas é sorte, não desenho: quem fetcha o
    # ícone É um navegador, e basta um cliente pedir `*/*` junto com HTML para a
    # imagem virar um 302 para `/conectar`. Uma imagem que às vezes é redirect é
    # o tipo de falha que aparece como "o ícone não carrega" e não deixa rastro.
    #
    # Regex, e não dois `location =`, para não duplicar os `proxy_set_header`: o
    # risco real aqui é alguém corrigir um dos blocos e esquecer o outro, e a
    # imagem passar a chegar com `X-Forwarded-Proto` errado. Regex continua
    # ganhando do prefixo `/mcp` — no nginx, location por regex é avaliado antes
    # de qualquer prefixo (exceto `^~`), então a precedência não se perde.
    location ~ ^/mcp/(icon\.png|favicon\.ico)$ {
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $esquema_original;
        proxy_set_header   X-Forwarded-Host $http_host;
        set                $kb_api_icone "${API_PROXY_TARGET}";
        proxy_pass         $kb_api_icone$request_uri;
    }

    location /mcp {
        # Navegador vai para a página de conexão; cliente MCP segue para a API.
        #
        # ⚠ O destino é `conectar`, SEM barra inicial, e isso é o conserto de um
        # bug real: com `/conectar` o navegador resolvia contra a RAIZ da origem
        # e ia para `https://<host-do-cluster>/conectar`, que é 404 — o
        # ingress publica esta aplicação sob `/knowledge-base` e remove o prefixo
        # antes do nginx, então aqui não há como saber o prefixo. O `<base href>`
        # é reescrito por `sub_filter`, mas `Location` é cabeçalho, não HTML, e o
        # sub_filter não o alcança.
        #
        # Sem a barra, quem resolve é o navegador, contra a URL que ELE pediu:
        # de `/knowledge-base/mcp` sai `/knowledge-base/conectar`, e do `/mcp`
        # local sai `/conectar`. Um destino, os dois ambientes certos, e nenhuma
        # dependência de header que o ingress não manda.
        if ($mcp_veio_do_navegador) {
            return 302 conectar;
        }

        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $esquema_original;
        proxy_set_header   X-Forwarded-Host $http_host;
        proxy_read_timeout 1800s;
        set                $kb_api_mcp "${API_PROXY_TARGET}";
        proxy_pass         $kb_api_mcp$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html NUNCA em cache. Os assets têm hash no nome e são
        # imutáveis, mas quem aponta para eles é este arquivo: servido de
        # cache, o navegador continua carregando o bundle ANTERIOR depois de um
        # deploy — e o sintoma é "a correção não subiu", com o servidor certo.
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # `.mjs` NAO esta no mime.types do nginx: ele sai como
    # application/octet-stream, e o navegador recusa executar um modulo ES com
    # esse tipo. O sintoma foi o visor de PDF morrendo com "Failed to fetch
    # dynamically imported module" -- o worker do pdf.js e um .mjs.
    #
    # A correcao vive num location proprio, e nao num bloco `types` no server,
    # porque `types` em qualquer contexto SUBSTITUI a tabela inteira herdada:
    # declarar so o mjs ali derrubaria o tipo de CSS, PNG e de todo o resto.
    # `types { }` vazio aqui dentro garante que a tabela nao case com nada e o
    # `default_type` valha. Location por regex ganha do prefixo /assets/, entao
    # o cabecalho de cache e repetido -- o arquivo tem hash no nome.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
