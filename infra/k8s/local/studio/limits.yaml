# Mesma rede de seguranca do stack-knowledge-base: pod sem limit declarado
# herda este teto, e ninguem leva a VM ao swap.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: stack-studio
spec:
  limits:
    - type: Container
      default: { cpu: "1", memory: 1Gi }
      defaultRequest: { cpu: 50m, memory: 64Mi }
      max: { cpu: "2", memory: 2Gi }
