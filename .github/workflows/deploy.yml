# Deploy do Goga a cada push no `main`: testes do Studio, build das imagens que mudaram (amd64),
# push no OCIR, `helm upgrade` do release `goga` (namespace `goga`, cluster goga-cluster) e espera
# do rollout. É o `./push` seguido do `helm upgrade` do charts/goga/README.md, feito por uma
# máquina. Mesmo desenho do deploy-homolog do Studio e do SGA (in9midia/studio, in9midia/sga).
#
# Quatro decisões que não são óbvias:
#
# 1. Tag imutável por commit (`<componente>-<sha>`, em images.tags do chart), no lugar da
#    `<componente>-1.0.0` sobrescrita a cada ./push. Com a tag do commit o próprio upgrade dispara o
#    rollout do componente que mudou, o que não mudou mantém a tag e o pod dele não reinicia (o
#    kb-api pode estar no meio de uma ingestão), e `helm rollback` volta para a imagem certa.
#
# 2. Só reconstrói a imagem cujo código mudou -- desde o commit que ESTÁ NO AR, e não desde o push
#    anterior. A tag no ar diz o commit; se uma rodada anterior falhou no build, a seguinte ainda vê
#    a diferença e reconstrói. `workflow_dispatch` com `force_all` reconstrói as quatro.
#
# 3. Os segredos não passam pelo GitHub. O secrets.yaml (não versionado) foi dado no primeiro
#    `helm upgrade` à mão e fica guardado no release; `--reset-then-reuse-values` reaproveita esses
#    valores sobre os defaults do chart novo. Por isso o release precisa existir (não há --install)
#    e o deploy à mão depois deste também deve usar --reset-then-reuse-values (charts/goga/README.md).
#
# 4. Runner amd64 (`ubuntu-24.04`): o nó do OKE é x86, como o PLATFORM do ./push.
#
# Segredos do repositório (Settings > Secrets and variables > Actions):
#   OCIR_USERNAME    grc4sekoeyuf/gabriel@tucci.net.br (o login do ./push)
#   OCIR_TOKEN       auth token do OCI desse usuário (o mesmo do secret `ocir` do namespace goga)
#   KUBECONFIG_GOGA  kubeconfig da conta goga-github-deployer, em base64
#                    (deploy/k8s/github-deployer.yaml + github-deployer-kubeconfig.sh)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Reconstruir as quatro imagens, mesmo sem mudança'
        type: boolean
        default: false

# Um deploy por vez, em fila. NUNCA cancelar no meio: um `helm upgrade` interrompido deixa o release
# em `pending-upgrade`, e todo upgrade seguinte é recusado até alguém fazer rollback à mão.
concurrency:
  group: deploy-goga
  cancel-in-progress: false

permissions:
  contents: read

env:
  REPO: gru.ocir.io/grc4sekoeyuf/goga
  RELEASE: goga
  NAMESPACE: goga
  HELM_VERSION: v4.1.1

jobs:
  test:
    name: Testes do Studio
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            studio/api/package-lock.json
            studio/ui/package-lock.json
      - name: studio-api (typecheck + testes)
        working-directory: studio/api
        # Sem Postgres o teste de integração do motor é pulado; os de unidade rodam.
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
      - name: studio-ui (typecheck)
        working-directory: studio/ui
        run: |
          npm ci
          npx tsc --noEmit -p .

  plan:
    name: O que mudou
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sets: ${{ steps.plan.outputs.sets }}
      new_sha: ${{ steps.plan.outputs.new_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico inteiro: a comparação é contra o commit que está no ar, que pode ser antigo.
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_GOGA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Comparar com o que está no ar
        id: plan
        env:
          FORCE_ALL: ${{ inputs.force_all || 'false' }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short=12 HEAD)"
          echo "new_sha=$sha" >> "$GITHUB_OUTPUT"

          # Só a chave images: o resto dos valores do release são as credenciais do secrets.yaml.
          live=$(helm get values "$RELEASE" -n "$NAMESPACE" -o json | jq -c '.images.tags // {}')

          # O que entra em cada imagem (contexto do build e o que ele copia de fora dele).
          declare -A PATHS=(
            [kb-api]="knowledge-base/services/kb-api"
            [kb-ui]="knowledge-base/services/kb-ui"
            [studio-api]="studio/api knowledge-base/content/evaluation"
            [studio-ui]="studio/ui studio/api/src/shared"
          )

          build=()
          sets=()
          {
            echo "### Plano"
            echo
            echo "| Imagem | No ar | Vai para | Motivo |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for c in kb-api kb-ui studio-api studio-ui; do
            current=$(jq -r --arg k "$c" '.[$k] // ""' <<<"$live")
            reason=""
            if [[ "$FORCE_ALL" == "true" ]]; then
              reason="force_all"
            elif [[ "$current" != "$c"-* ]]; then
              reason="a tag no ar (${current:-a da version}) não diz o commit"
            else
              base="${current#"$c"-}"
              if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                reason="commit $base fora do histórico"
              elif ! git diff --quiet "$base" HEAD -- ${PATHS[$c]}; then
                reason="mudou desde $base"
              fi
            fi

            if [[ -n "$reason" ]]; then
              build+=("$c")
              tag="$c-$sha"
            else
              tag="$current"
              reason="sem mudança"
            fi
            sets+=("--set" "images.tags.$c=$tag")
            echo "| $c | ${current:-—} | $tag | $reason |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "sets=${sets[*]}" >> "$GITHUB_OUTPUT"

          # Dockerfile e contexto de cada imagem: os mesmos do ./push.
          matrix=$(printf '%s\n' "${build[@]}" | jq -R 'select(length > 0)' | jq -sc '
            map({
              "kb-api":     {component: "kb-api",     file: "knowledge-base/services/kb-api/Dockerfile", context: "knowledge-base/services/kb-api"},
              "kb-ui":      {component: "kb-ui",      file: "knowledge-base/services/kb-ui/Dockerfile",  context: "knowledge-base/services/kb-ui"},
              "studio-api": {component: "studio-api", file: "studio/api/Dockerfile",                     context: "."},
              "studio-ui":  {component: "studio-ui",  file: "studio/ui/Dockerfile",                      context: "studio"}
            }[.])')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Imagens a construir: $matrix"

  build:
    name: Build ${{ matrix.component }}
    needs: [test, plan]
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    strategy:
      # Uma imagem que falha não cancela as outras: elas terminam, gravam o cache e a próxima rodada
      # só refaz a que quebrou. O deploy continua bloqueado -- ele exige o build inteiro verde.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # A imagem do kb-api traz torch + docling: sem espaço extra o runner enche o disco no export.
      - name: Liberar disco
        if: matrix.component == 'kb-api'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: gru.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REPO }}:${{ matrix.component }}-${{ needs.plan.outputs.new_sha }}
            ${{ env.REPO }}:${{ matrix.component }}-latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.component }}-${{ needs.plan.outputs.new_sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          # kb-api: só as camadas da imagem final; com mode=max a camada do torch estoura o cache.
          cache-to: type=gha,scope=${{ matrix.component }},mode=${{ matrix.component == 'kb-api' && 'min' || 'max' }}

  deploy:
    name: Helm upgrade
    needs: [test, plan, build]
    # Roda também quando nenhuma imagem mudou (build pulado): mudança só no chart ainda é deploy.
    if: always() && needs.test.result == 'success' && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: goga
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: azure/setup-kubectl@v5

      - name: Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_GOGA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # --rollback-on-failure (o antigo --atomic) espera tudo ficar pronto e, se algo não subir dentro
      # do --timeout, volta o release para a revisão anterior. As migrações do Studio e da KB rodam no
      # boot de cada API: migração que falha deixa o pod sem ficar pronto, e o rollback devolve a
      # imagem anterior.
      - name: helm upgrade
        run: |
          helm upgrade "$RELEASE" charts/goga \
            -n "$NAMESPACE" \
            --reset-then-reuse-values \
            ${{ needs.plan.outputs.sets }} \
            --rollback-on-failure \
            --timeout 15m \
            --description "github ${GITHUB_SHA::12} run ${GITHUB_RUN_ID}"

      - name: Rollout
        run: |
          for d in kb-api kb-ui studio-api studio-ui; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$d" --timeout=5m
          done
          {
            echo "### No ar"
            echo
            echo '```'
            kubectl -n "$NAMESPACE" get deploy kb-api kb-ui studio-api studio-ui \
              -o custom-columns='DEPLOYMENT:.metadata.name,IMAGEM:.spec.template.spec.containers[0].image,PRONTOS:.status.readyReplicas'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Histórico do release
        if: failure()
        run: |
          helm history "$RELEASE" -n "$NAMESPACE" --max 5 || true
          kubectl -n "$NAMESPACE" get pods || true
          kubectl -n "$NAMESPACE" logs deploy/studio-api --tail=80 || true
          kubectl -n "$NAMESPACE" logs deploy/kb-api --tail=80 || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -30 || true
